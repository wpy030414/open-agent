<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>导出宜搭 Cookies</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #d0bcff; }
    .info { background: #2b2930; padding: 16px; border-radius: 8px; margin: 20px 0; }
    button { background: #6750a4; color: #fff; border: none; padding: 12px 24px; border-radius: 20px; font-size: 14px; cursor: pointer; margin: 10px 5px; }
    button:hover { background: #7f67be; }
    textarea { width: 100%; height: 200px; background: #1c1b1f; color: #e0e0e0; border: 1px solid #49454f; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; }
    .steps { line-height: 2; }
    .steps li { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>导出宜搭 Cookies</h1>

  <div class="info">
    <p><strong>当前域名：</strong> <span id="domain">-</span></p>
    <p><strong>Cookies 数量：</strong> <span id="count">-</span></p>
  </div>

  <ol class="steps">
    <li>请确保此页面在 <strong>aliwork.com</strong> 域名下打开（否则无法读取 cookies）</li>
    <li>点击下方 <strong>"导出 Cookies"</strong> 按钮</li>
    <li>复制导出的文本，发送给 AI 助手</li>
  </ol>

  <button onclick="exportCookies()">导出 Cookies</button>
  <button onclick="copyToClipboard()">复制到剪贴板</button>

  <h3>导出的 Cookies：</h3>
  <textarea id="output" placeholder="点击上方按钮导出 cookies..."></textarea>

  <script>
    document.getElementById('domain').textContent = window.location.hostname;

    function getCookies() {
      return document.cookie;
    }

    function exportCookies() {
      const cookies = getCookies();
      const count = cookies.split(';').filter(c => c.trim()).length;
      document.getElementById('count').textContent = count;
      document.getElementById('output').value = cookies;
    }

    function copyToClipboard() {
      const textarea = document.getElementById('output');
      textarea.select();
      document.execCommand('copy');
      alert('已复制到剪贴板！');
    }

    // 自动显示
    window.onload = () => {
      const cookies = getCookies();
      const count = cookies.split(';').filter(c => c.trim()).length;
      document.getElementById('count').textContent = count;
    };
  </script>
</body>
</html>
